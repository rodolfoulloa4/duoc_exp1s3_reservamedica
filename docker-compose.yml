services:
  reservamedica:
    build: .
    ports:
      - "${SERVER_PORT:-8083}:8083"
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@dba001_tp?TNS_ADMIN=/app/wallet}"
      SPRING_DATASOURCE_USERNAME: "FULLSTACK"
      SPRING_DATASOURCE_PASSWORD: "Fullst4ck......"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-oracle.jdbc.OracleDriver}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}"
      ORACLE_WALLET_PATH: "/app/wallet"
      LOG_FILE_NAME: "/app/logs/reservamedica.log"
    volumes:
      - app-logs:/app/logs
      - c:/Wallet_dba001:/app/wallet:ro

volumes:
  app-logs:
